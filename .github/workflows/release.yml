name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write # to publish the release

jobs:
  release:
    runs-on: ubuntu-latest # the builds are pure Go, so one runner cross-compiles them all
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GoReleaser reads the tag history
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
